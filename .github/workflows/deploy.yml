name: Deploy line list to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      # Guard: never let patient data or a SAS token reach the deployment
      - name: Check for secrets and data in the commit
        run: |
          if grep -rlE 'blob\.core\.windows\.net.*sig=' www api 2>/dev/null; then
            echo "::error::A SAS token was found in www/ or api/. Refusing to deploy."; exit 1
          fi
          if grep -rl 'PI_FullName"' www 2>/dev/null | xargs -r grep -lE '"rows":\[\[' ; then
            echo "::error::Patient records appear to be embedded in www/. Refusing to deploy."; exit 1
          fi
          echo "No embedded credentials or records found."

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "www"
          api_location: "api"
          output_location: ""

  close_pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
