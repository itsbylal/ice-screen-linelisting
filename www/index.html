<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICE TB Program — Line List</title>
<style>
  :root{
    /* Mercy Corps brand: red #D0202E (Pantone 1795 C), white, grey */
    --mc:#D0202E; --mc-dark:#9E141F; --mc-deep:#7A0F18; --mc-light:#F4C3C7;
    --g1:#B01A26; --g2:#D0202E; --g3:#7A0F18;
    --bg:#f6f4f4; --panel:#fff; --line:#e3dcdc; --line2:#f0eaea;
    --ink:#1f1a1a; --mute:#7a6f6f; --accent:#D0202E;
    --pos:#fff; --posbg:#D0202E; --neg:#4a5a52; --negbg:#eef0ef;
    --warn:#8a5300; --warnbg:#fdf3e2; --chip:#f4eeee;
    --rowh:34px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- header ---------- */
  header{
    background:linear-gradient(100deg,var(--g3),var(--g1) 45%,var(--g2));
    color:#fff; padding:10px 16px; display:flex; align-items:center; gap:14px; flex:0 0 auto;
  }
  .brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .brand h1{font-size:17px; margin:0; font-weight:650; letter-spacing:-.2px}
  .brand .mark{font-size:16px}
  .sub{font-size:11px; opacity:.82; margin-top:3px; display:flex; gap:7px; flex-wrap:wrap}
  .sub span:not(:last-child)::after{content:"·"; margin-left:7px; opacity:.6}
  .stamp{margin-left:auto; text-align:right; font-size:11px; opacity:.9; line-height:1.5; white-space:nowrap}
  .stamp b{display:block; font-size:12px; font-weight:600; opacity:1}
  .status{
    display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:11px;
    background:rgba(255,255,255,.16); font-size:10.5px; font-weight:600; letter-spacing:.02em;
  }
  .status .dot{width:7px; height:7px; border-radius:50%; background:#ffd9a0; flex:0 0 auto}
  .status.live .dot{background:#7ff0a8; box-shadow:0 0 0 3px rgba(127,240,168,.25)}
  .status.stale .dot{background:#ffc46b}
  .status.err .dot{background:#ff9b9b}
  .status.busy .dot{background:#fff; animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ---------- toolbar ---------- */
  .bar{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:9px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex:0 0 auto;
  }
  .search{position:relative}
  .search svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.45}
  input[type=search]{
    width:250px; padding:7px 10px 7px 29px; border:1px solid var(--line);
    border-radius:6px; font:inherit; background:#fbfcfc;
  }
  input[type=search]:focus,select:focus,#frow input:focus{outline:2px solid #f0b8bd; outline-offset:0; border-color:var(--mc)}
  select{
    padding:7px 9px; border:1px solid var(--line); border-radius:6px;
    font:inherit; background:#fbfcfc; max-width:190px;
  }
  button{font:inherit; border-radius:6px; border:1px solid var(--line); background:#fbfcfc; padding:7px 11px; cursor:pointer; color:var(--ink)}
  button:hover{background:#f0f3f1}
  .btn-clear{color:#8a3a34}
  button.active{background:#fbe9eb; border-color:#e8adb2; color:var(--mc-dark); font-weight:600}
  .btn-export{background:var(--mc); border-color:var(--mc); color:#fff; font-weight:600}
  .btn-export:hover{background:var(--mc-dark); border-color:var(--mc-dark)}
  .count{font-size:12px; color:var(--mute); margin-left:2px}
  .count b{color:var(--ink)}
  .spacer{margin-left:auto; display:flex; gap:8px; align-items:center}
  .toggle{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--mute); cursor:pointer; user-select:none}
  .cols-btn{position:relative}

  /* ---------- column picker ---------- */
  .pop{
    position:absolute; right:0; top:calc(100% + 6px); z-index:60; width:320px; max-height:62vh;
    overflow:auto; background:var(--panel); border:1px solid var(--line);
    border-radius:9px; box-shadow:0 12px 34px rgba(0,0,0,.16); padding:10px; display:none; text-align:left;
  }
  .pop.open{display:block}
  .pop label{display:flex; gap:7px; align-items:center; padding:3.5px 5px; border-radius:5px; cursor:pointer; font-size:12px}
  .pop label:hover{background:var(--chip)}
  /* group row: a heading that is also a checkbox for everything beneath it */
  .pop label.grp{
    margin:9px 0 3px; padding:5px; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; color:var(--mc-dark); border-bottom:1px solid var(--line2);
    border-radius:4px; position:sticky; top:-10px; background:var(--panel); z-index:1;
  }
  .pop label.grp:hover{background:#fbeff0}
  .pop label.grp.off{color:var(--mute)}
  .pop label.grp span{flex:1}
  .pop label.grp em{font-style:normal; font-weight:600; opacity:.55; font-size:10px}
  .pop label.col{margin-left:16px}
  .pop input[type=checkbox]{accent-color:var(--mc); flex:0 0 auto; cursor:pointer}
  .pop .pop-act{display:flex; gap:6px; padding:2px 2px 8px; border-bottom:1px solid var(--line2); margin-bottom:4px}
  .pop .pop-act button{padding:5px 9px; font-size:11.5px}

  /* ---------- table ---------- */
  .wrap{flex:1 1 auto; overflow:auto; background:var(--panel); position:relative}
  table{border-collapse:separate; border-spacing:0; table-layout:fixed; font-variant-numeric:tabular-nums}
  thead tr:first-child th{
    position:sticky; top:0; z-index:20; color:#fff; height:31px;
    background-color:#A81826;                      /* opaque base under the gradient */
    background-image:linear-gradient(180deg,#C01E2A,#9E141F);
    font-size:11.5px; font-weight:600; text-align:left; padding:7px 9px;
    border-right:1px solid rgba(255,255,255,.14); white-space:nowrap; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis;
  }
  thead tr:first-child th:hover{background-color:#C01E2A; background-image:linear-gradient(180deg,#D0202E,#A81826)}
  thead th .ar{opacity:.45; font-size:9px; margin-left:3px}
  thead th.sorted .ar{opacity:1}

  /* per-column filter row */
  thead tr#frow th{
    position:sticky; top:31px; z-index:19; background:#f2e8e9;
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:3px 4px; height:29px;
  }
  #frow.hidden{display:none}
  #frow input,#frow select{
    width:100%; min-width:0; max-width:none; padding:3px 5px; font-size:11px;
    border:1px solid #d8c6c8; border-radius:4px; background:#fff; color:var(--ink);
  }
  #frow input::placeholder{color:#b09a9c}
  #frow .on{border-color:var(--mc); background:#fdeff0; font-weight:600}
  tbody td{
    padding:6px 9px; border-bottom:1px solid var(--line2); border-right:1px solid var(--line2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; height:var(--rowh);
  }
  tbody tr:nth-child(even) td{background:#fafbfa}
  tbody tr:hover td{background:#fdf1f2}
  th.stick,td.stick{position:sticky; z-index:15}
  /* Frozen header cells must out-stack the header cells that scroll past them,
     otherwise later siblings paint over them and the frozen columns' headings
     look like they are scrolling. Specificity has to match the
     `thead tr:first-child th` / `thead tr#frow th` rules above to win. */
  thead tr:first-child th.stick{z-index:32}
  thead tr#frow th.stick{z-index:31}
  td.stick{background:var(--panel)}
  tbody tr:nth-child(even) td.stick{background:#fafbfa}
  tbody tr:hover td.stick{background:#fdf1f2}
  td.stick.edge,th.stick.edge{border-right:1px solid var(--line)}
  /* soft shadow marks where the frozen columns end */
  td.stick.edge{box-shadow:6px 0 8px -6px rgba(0,0,0,.22)}
  thead tr:first-child th.stick.edge{box-shadow:6px 0 8px -6px rgba(0,0,0,.34)}
  thead tr#frow th.stick.edge{box-shadow:6px 0 8px -6px rgba(0,0,0,.18)}
  .pill{display:inline-block; padding:1px 7px; border-radius:11px; font-size:11px; font-weight:600; line-height:1.5}
  .p-pos{background:var(--posbg); color:var(--pos)}          /* brand red, solid — a positive result */
  .p-neg{background:var(--negbg); color:var(--neg)}
  .p-warn{background:var(--warnbg); color:var(--warn)}
  .p-mute{background:var(--chip); color:var(--mute)}
  .empty{padding:44px 16px; text-align:center; color:var(--mute)}
  .note{font-size:11px; color:var(--mute); padding:7px 13px; background:#fbfcfc; border-top:1px solid var(--line); flex:0 0 auto}
  .note code{background:var(--chip); padding:1px 5px; border-radius:4px}
  @media (max-width:820px){ .stamp{display:none} input[type=search]{width:170px} }

  /* ---------- multi-select ---------- */
  .ms{position:relative; display:inline-block}
  .ms-btn{
    display:flex; align-items:center; gap:6px; max-width:200px; padding:7px 9px;
    border:1px solid var(--line); border-radius:6px; background:#fbfcfc; font:inherit;
    color:var(--ink); cursor:pointer; text-align:left;
  }
  .ms-btn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ms-btn i{font-style:normal; font-size:9px; opacity:.5; margin-left:auto}
  .ms.on > .ms-btn{border-color:var(--mc); background:#fdeff0; font-weight:600; color:var(--mc-dark)}
  .ms.open > .ms-btn{outline:2px solid #f0b8bd; border-color:var(--mc)}
  /* fixed so the popup escapes the table's overflow clipping */
  .ms-pop{
    position:fixed; z-index:500; width:250px; max-height:330px; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    box-shadow:0 14px 38px rgba(0,0,0,.19); overflow:hidden;
  }
  .ms-tools{display:flex; gap:5px; padding:7px; border-bottom:1px solid var(--line2)}
  .ms-tools input{flex:1; min-width:0; padding:5px 7px; font:inherit; font-size:11.5px;
    border:1px solid var(--line); border-radius:5px; background:#fbfcfc}
  .ms-tools button{padding:4px 8px; font-size:11px; border-radius:5px}
  .ms-list{overflow:auto; padding:5px}
  .ms-list label{
    display:flex; gap:7px; align-items:center; padding:4px 6px; border-radius:5px;
    font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .ms-list label:hover{background:var(--chip)}
  .ms-list input{accent-color:var(--mc); flex:0 0 auto}
  .ms-none{padding:14px 8px; text-align:center; color:var(--mute); font-size:11.5px}
  /* compact variant for the in-table filter row */
  #frow .ms{display:block}
  #frow .ms-btn{width:100%; max-width:none; padding:3px 5px; font-size:11px; border-color:#d8c6c8; background:#fff}
  #frow .ms.on > .ms-btn{border-color:var(--mc); background:#fdeff0}

  /* ---------- access gate ---------- */
  #gate{
    position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(140deg,var(--mc-deep),var(--mc-dark) 55%,var(--mc));
  }
  #gate.hidden{display:none}
  #gateCard{
    width:min(360px,88vw); background:#fff; border-radius:12px; padding:30px 30px 24px;
    box-shadow:0 22px 60px rgba(0,0,0,.3); text-align:center;
  }
  #gateCard h2{margin:0 0 6px; font-size:19px; color:var(--mc-dark); letter-spacing:-.2px}
  #gateCard .gsub{margin:0 0 20px; font-size:12.5px; color:var(--mute)}
  #gatePw{
    width:100%; padding:11px 13px; font:inherit; font-size:14px; text-align:center;
    border:1px solid var(--line); border-radius:7px; background:#fbfafa; letter-spacing:.06em;
  }
  #gatePw:focus{outline:2px solid #f0b8bd; border-color:var(--mc)}
  #gateGo{
    width:100%; margin-top:12px; padding:11px; background:var(--mc); border-color:var(--mc);
    color:#fff; font-weight:700; font-size:13.5px; border-radius:7px; cursor:pointer;
  }
  #gateGo:hover{background:var(--mc-dark); border-color:var(--mc-dark)}
  #gateCard .gerr{margin:12px 0 0; font-size:12px; color:var(--mc); font-weight:600}
  #gateCard .gfoot{margin:20px 0 0; font-size:11px; color:var(--mute); line-height:1.6}
  #gateCard.shake{animation:shake .32s}
  @keyframes shake{
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
    40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}
  }
  body.locked > header,body.locked > .bar,body.locked > .wrap,body.locked > .note{visibility:hidden}
</style>
</head>
<body class="locked">

<!-- ===== access gate ===================================================
     Shown before anything else; the table and the live fetch are held back
     until the code is accepted. The code is not stored in this file - only
     a salted SHA-256 digest of it is.
     ==================================================================== -->
<div id="gate">
  <form id="gateCard" autocomplete="off">
    <h2>🔒 ICE TB Program</h2>
    <p class="gsub">Enter password to access the Line List</p>
    <input type="password" id="gatePw" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit" id="gateGo">Access Dashboard</button>
    <p class="gerr" id="gateErr" hidden>Incorrect password</p>
    <p class="gfoot">Mercy Corps Pakistan</p>
  </form>
</div>

<header>
  <div>
    <div class="brand">
      <span class="mark">🔬</span>
      <h1>ICE TB Program — Line List</h1>
    </div>
    <div class="sub"><span>Mercy Corps Pakistan</span></div>
  </div>
  <div class="stamp">
    <span class="status" id="status"><i class="dot"></i><span id="statusTxt">Checking for live data…</span></span>
    <b id="stamp"></b>
    <span id="range"></span>
  </div>
</header>

<div class="bar">
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="Search name, UID, district, lab number…" autocomplete="off">
  </div>
  <div class="ms" id="f_CP_Province"></div>
  <div class="ms" id="f_CP_District"></div>
  <div class="ms" id="f_Username"></div>
  <div class="ms" id="f_LaboratoryName"></div>
  <div class="ms" id="f_MTB"></div>
  <div class="ms" id="f_RR"></div>
  <button class="btn-clear" id="clear">✕ Clear</button>
  <button id="reload" title="Fetch the latest data from Azure now">↻ Refresh</button>
  <button class="btn-export" id="export">⬇ Export CSV</button>
  <span class="count" id="count"></span>
  <div class="spacer">
    <button id="fRow" class="active" title="Show or hide the per-column filter row">⛃ Column filters</button>
    <div class="cols-btn">
      <button id="colsBtn">▦ Columns <span id="colsN"></span></button>
      <div class="pop" id="pop">
        <div class="pop-act">
          <button data-all="1">Select all</button>
          <button data-all="0">Clear all</button>
          <button data-all="core">Core set</button>
        </div>
        <div id="popBody"></div>
      </div>
    </div>
  </div>
</div>

<div class="wrap" id="wrap">
  <table id="tbl">
    <thead>
      <tr id="hrow"></tr>
      <tr id="frow"></tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No records match the current filters.</div>
</div>

<div class="note" id="note"></div>

   Checkbox list in a popup. Selection is a Set; an empty Set means

function closeMulti(except){
  document.querySelectorAll('.ms.open').forEach(m=>{ if(m!==except) m.classList.remove('open'); });

function makeMulti(host, cfg){
  const sel = cfg.sel;
  host.classList.add('ms');
  host.innerHTML = '<button type="button" class="ms-btn"><span></span><i>▾</i></button>';
  const btn = host.querySelector('.ms-btn');
  let pop = null;

  const label = ()=>{
    if(sel.size === 0) return cfg.allLabel;
    if(sel.size === 1) return [...sel][0];
    return sel.size + ' selected';
  };
  const paint = ()=>{
    btn.querySelector('span').textContent = label();
    btn.title = sel.size > 1 ? [...sel].join(', ') : '';
    host.classList.toggle('on', sel.size > 0);
  };
  const build = ()=>{
    pop = document.createElement('div');
    pop.className = 'ms-pop';
    pop.dataset.for = cfg.key || '';        // links the popup back to its column
    pop.innerHTML =
      '<div class="ms-tools"><input type="search" placeholder="Search…">' +
      '<button type="button" data-a="all">All</button>' +
      '<button type="button" data-a="none">None</button></div><div class="ms-list"></div>';
    const list = pop.querySelector('.ms-list');
    list.innerHTML = cfg.options.length
      ? cfg.options.map(v=>'<label><input type="checkbox" value="'+esc(v)+'"' +
          (sel.has(v)?' checked':'') + '> ' + esc(v) + '</label>').join('')
      : '<div class="ms-none">No values</div>';
    list.addEventListener('change', e=>{
      const cb = e.target.closest('input[type=checkbox]'); if(!cb) return;
      cb.checked ? sel.add(cb.value) : sel.delete(cb.value);
      paint(); cfg.onChange();
    });
    pop.querySelector('input[type=search]').addEventListener('input', e=>{
      const t = e.target.value.toLowerCase();
      list.querySelectorAll('label').forEach(l=>{
        l.style.display = l.textContent.trim().toLowerCase().includes(t) ? '' : 'none';
      });
    });
    // All / None act on what the search currently shows
    pop.querySelectorAll('.ms-tools button').forEach(b=> b.onclick = ()=>{
      [...list.querySelectorAll('label')].filter(l=>l.style.display!=='none').forEach(l=>{
        const cb = l.querySelector('input');
        cb.checked = b.dataset.a === 'all';
        cb.checked ? sel.add(cb.value) : sel.delete(cb.value);
      });
      paint(); cfg.onChange();
    });
    pop.addEventListener('click', e=> e.stopPropagation());
    document.body.appendChild(pop);
  };
  const place = ()=>{
    const r = btn.getBoundingClientRect();
    const w = 250, vh = window.innerHeight;
    pop.style.left = Math.max(6, Math.min(r.left, window.innerWidth - w - 6)) + 'px';
    const below = vh - r.bottom - 10;
    if(below > 190 || below > r.top){ pop.style.top = (r.bottom + 4) + 'px'; pop.style.maxHeight = below + 'px'; }
    else { pop.style.top = Math.max(6, r.top - Math.min(330, r.top - 10) - 4) + 'px';
           pop.style.maxHeight = (r.top - 14) + 'px'; }
  };
  btn.onclick = e =>{
    e.stopPropagation();
    const wasOpen = host.classList.contains('open');
    closeMulti(host);
    if(wasOpen){ host.classList.remove('open'); pop.style.display='none'; return; }
    if(!pop) build();
    pop.style.display = 'flex';
    place();
    host.classList.add('open');
    pop.querySelector('input[type=search]').focus();
  };
  host.msReset  = ()=>{ sel.clear(); if(pop) pop.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false); paint(); };
  host.msRepaint= paint;
  host.msPlace  = ()=>{ if(pop && host.classList.contains('open')) place(); };
  host.msDrop   = ()=>{ if(pop){ pop.remove(); pop = null; } host.classList.remove('open'); };
  host.msOpen   = ()=>{ if(!host.classList.contains('open')) btn.onclick(new window.Event('click')); return pop; };
  paint();
  return host;
}

function buildPicker(){

const colBoxes   = ()=> [...document.querySelectorAll('#popBody input[data-col]')];

/* group box shows checked / unchecked / indeterminate from its children */
function syncGroupBoxes(){
  groupBoxes().forEach(gb=>{
    const kids = colBoxes().filter(cb=>cb.dataset.in === gb.dataset.group);
    const n = kids.filter(cb=>cb.checked).length;
    gb.checked = n === kids.length && n > 0;
    gb.indeterminate = n > 0 && n < kids.length;
    gb.closest('.grp').classList.toggle('off', n === 0);
  });
}

function syncCols(){

    visible = ['Username']; on.add('Username');

  Object.keys(colSel).forEach(c=>{ if(!on.has(c)) colSel[c].clear(); });

}

/* ---------- pipeline ---------- */
function run(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  // toolbar + per-column dropdowns: keep a row if its value is any of the chosen ones
  const sets = [];
  FDEF.forEach(([c])=>{ if(tbSel[c] && tbSel[c].size) sets.push([IX[c], tbSel[c]]); });
  Object.keys(colSel).forEach(c=>{ if(colSel[c].size) sets.push([IX[c], colSel[c]]); });
  // per-column text boxes: comma-separated terms match as OR
  const txt = Object.keys(colTxt).filter(c=>colTxt[c]).map(c=>
    [IX[c], colTxt[c].toLowerCase().split(',').map(s=>s.trim()).filter(Boolean)]);
  view = rows.filter(r=>{
    for(const [i,s] of sets) if(!s.has(r[i])) return false;
    for(const [i,ts] of txt){
      const v = String(r[i]).toLowerCase();
      if(!ts.some(t=>v.includes(t))) return false;
    }
    if(!terms.length) return true;
    const hay = r.join('').toLowerCase();
    return terms.every(t=>hay.includes(t));
  });
  // districts follow the province selection
  sort(); draw();
}
function sort(){
  const i = IX[sortCol]; if(i==null) return;
  const num = view.every(r=>r[i]==='' || !isNaN(parseFloat(r[i])));
  view.sort((a,b)=>{
    let x=a[i], y=b[i];
    if(x==='' ) return 1; if(y==='') return -1;
    if(num){ x=parseFloat(x); y=parseFloat(y); }
    return (x<y?-1:x>y?1:0)*sortDir;
  });
}

/* one filter control per visible column: dropdown when the column has a small
   value set, otherwise a "contains" text box */
function filterRow(){
  const sticks = stickCount();
  // discard any popups from the previous build
  document.querySelectorAll('#frow .ms').forEach(m=> m.msDrop && m.msDrop());
  document.getElementById('frow').innerHTML = visible.map((c,n)=>{
    const st = STICKY.includes(c);
    const cls = st ? ('stick'+(n===sticks-1?' edge':'')) : '';

    const ctl = domains[c]
      ? '<div class="ms" data-col="'+esc(c)+'"></div>'
      : '<input type="text" data-col="'+esc(c)+'" value="'+esc(colTxt[c]||'')+'" ' +
        'placeholder="contains…" title="Matches any of several terms if you separate them with commas">';
    return '<th class="'+cls+'" style="'+left+'">'+ctl+'</th>';
  }).join('');

  document.querySelectorAll('#frow .ms[data-col]').forEach(host=>{
    const c = host.dataset.col;
    colSel[c] = colSel[c] || new Set();
    makeMulti(host, {key: c, options: domains[c]||[], allLabel: 'All', sel: colSel[c], onChange: run});
  });
  document.querySelectorAll('#frow input[data-col]').forEach(el=>{
    el.classList.toggle('on', !!el.value);
    el.oninput = debounce(()=>{
      const c = el.dataset.col, v = el.value.trim();
      if(v) colTxt[c] = v; else delete colTxt[c];
      el.classList.toggle('on', !!v);
      run();
    }, 200);
    el.onclick = e => e.stopPropagation();
  });
}
function stickCount(){ return visible.filter(c=>STICKY.includes(c)).length; }
function stickLeft(c){
  let x = 0;
  for(const v of visible){ if(v===c) break; if(STICKY.includes(v)) x += (W[v]||DEFW); }
  return x;
}
function pill(col, v){
  if(v==='') return '';
  if(col==='MTB')      return chip(v, {'Detected':'p-pos','Not Detected':'p-neg','Invalid':'p-warn','Error':'p-warn'}[v]||'p-mute');
  if(col==='RR')       return chip(v, {'Detected':'p-pos','Not Detected':'p-neg','Indeterminate':'p-warn'}[v]||'p-mute');
  if(col==='MTBDetected') return chip(v,'p-warn');
  if(col==='Consent'||col==='Consent_TongueSwab'||col==='Consent_Followup'||col==='Consent_Sign')
    return v.toLowerCase()==='no' ? chip('no','p-pos') : esc(v);
  return esc(v);
}
function chip(v,cls){ return '<span class="pill '+cls+'">'+esc(v)+'</span>'; }
function show(col, raw){ return pill(col, raw); }

    out += '<tr>' + visible.map((c,n)=>{
      const st = STICKY.includes(c);
      const cls = st ? ('stick'+(n===sticks-1?' edge':'')) : '';
      const left = st ? 'left:'+stickLeft(c)+'px;' : '';
      const raw = row[IX[c]];
      return '<td class="'+cls+'" style="'+left+'" title="'+esc(raw)+'">'+show(c,raw)+'</td>';
    }).join('') + '</tr>';
  }
  if(last<view.length) out += '<tr style="height:'+((view.length-last)*ROWH)+'px"></tr>';
  body.innerHTML = out;
}
wrap.addEventListener('scroll', ()=>{
  if(view.length) paint();
  hideAllPops();          // fixed popups would otherwise detach from their column
}, {passive:true});
window.addEventListener('resize', ()=>{ if(view.length) paint(); });

/* ---------- export ---------- */
document.getElementById('export').onclick = ()=>{
  const q = c => { const s = c==null?'':String(c); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const head = visible.map(c=>q(labels[IX[c]])).join(',');
  const lines = view.map(r=>visible.map(c=>q(r[IX[c]])).join(','));
  const blob = new Blob(['﻿'+head+'\n'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ice_line_list_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
};

/* ================= live data ==================================
   The page renders the embedded snapshot first so it is usable instantly,
   then fetches the Azure blob and swaps the dataset in if that succeeds.
   The transforms below mirror build_linelist.py exactly, so a live load
   and a scripted rebuild produce the same table.
   ============================================================== */
const S = {
  el:   document.getElementById('status'),
  txt:  document.getElementById('statusTxt'),
  set(cls, msg, tip){
    this.el.className = 'status ' + cls;
    this.txt.textContent = msg;
    this.el.title = tip || '';
  }
};

function cellOf(col, raw){
  const v = (raw===null || raw===undefined) ? '' : String(raw).trim();
  if(v==='') return '';
  if(LIVE.decode && LIVE.decode[col]) return LIVE.decode[col][v] || v;
  if(col==='CP_Province')   return (LIVE.province||{})[v.toLowerCase()] || v;
  if(col==='LaboratoryName')return (LIVE.lab||{})[v.toLowerCase()] || v;
  if(col==='archived')      return /^(true|1)$/i.test(v) ? 'Yes' : 'No';
  return v;
}

function ingest(recs){
  // keep the established column order; append any field the export has added
  const known = new Set(cols);
  const newCols = [];
  recs.forEach(o=>{ for(const k in o){ if(!known.has(k)){ known.add(k); newCols.push(k); } } });
  if(newCols.length){
    cols = cols.concat(newCols);
    labels = labels.concat(newCols);          // raw name until the script relabels it
    groups = groups.concat(newCols.map(()=> 'Other'));
    reindex();
  }
  const R = recs.map(o => cols.map(c => cellOf(c, o[c])));

  // rebuild per-column domains and the toolbar filter lists
  const D = {}, max = LIVE.domainMax || 60;
  cols.forEach((c,i)=>{
    const s = new Set();
    let over = false;
    for(const r of R){ if(r[i]!==''){ s.add(r[i]); if(s.size>max){ over=true; break; } } }
    if(!over && s.size) D[c] = [...s].sort();
  });
  const F = {};
  (LIVE.filterCols||[]).forEach(c=>{
    const i = IX[c], s = new Set();
    if(i!==undefined) for(const r of R) if(r[i]!=='') s.add(r[i]);
    F[c] = [...s].sort();
  });

  const dates = R.map(r=>r[IX['CP_EventDate']]).filter(Boolean).sort();
  const now = new Date();
  const M = {
    records: R.length,
    variables: cols.length,
    built: now.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})
           + ' - ' + now.toTimeString().slice(0,5),
    eventMin: dates[0] || '', eventMax: dates[dates.length-1] || '',
  };
  return {rows:R, domains:D, filters:F, meta:M, added:newCols};
}

async function pull(manual){
  if(!LIVE.url){ S.set('stale','Snapshot only','No data URL was configured at build time.'); return; }
  S.set('busy', manual ? 'Refreshing…' : 'Loading live data…');
  const t0 = performance.now();
  try{
    const res = await fetch(LIVE.url, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    const text = await res.text();
    const t = text.trim();
    const recs = t.startsWith('[') ? JSON.parse(t)
               : t.split('\n').filter(l=>l.trim()).map(l=>JSON.parse(l));
    // same guardrails as the build script: never replace good data with bad
    if(!Array.isArray(recs) || recs.length < 100)
      throw new Error('only ' + (recs.length||0) + ' records — looks truncated');
    const need = ['UID','Case_ID','CP_Province','CP_EventDate','MTB'];
    const seen = new Set(); recs.forEach(o=>{ for(const k in o) seen.add(k); });
    const missing = need.filter(k=>!seen.has(k));
    if(missing.length) throw new Error('missing fields: ' + missing.join(', '));

    const D = ingest(recs);
    rows = D.rows; domains = D.domains; filters = D.filters; meta = D.meta;
    stampMeta(); toolbarFilters(); buildPicker(); header(); run();
    const secs = ((performance.now()-t0)/1000).toFixed(1);
    S.set('live', 'Live · ' + meta.records.toLocaleString() + ' records',
          'Fetched from Azure in ' + secs + 's at ' + meta.built +
          (D.added.length ? '\nNew fields in this export: ' + D.added.join(', ') : ''));
    if(D.added.length) console.info('New fields appeared in the export:', D.added);
  }catch(err){
    // a blocked/unreachable fetch surfaces as TypeError; name check is realm-safe
    const cors = err && (err.name === 'TypeError' || /failed to fetch|networkerror|load failed/i.test(err.message||''));
    S.set('err', 'Snapshot · ' + DATA.meta.built.split(' - ')[0],
      (cors
        ? 'Could not reach the blob. Most likely the storage account needs a CORS rule '
        + '(Azure portal → Storage account → Resource sharing (CORS) → Blob service → '
        + 'allowed origin *, allowed method GET, allowed headers *). Could also be offline '
        + 'or an expired SAS token.'
        : 'Live fetch failed: ' + err.message)
      + '\n\nShowing the snapshot embedded at build time — the table below is still fully usable.');
    console.warn('Live fetch failed:', err);
  }
}
document.getElementById('reload').onclick = ()=> pull(true);
// refresh again if the page is left open past midnight, and on tab focus after 6h
let lastPull = Date.now();
setInterval(()=>{ if(Date.now()-lastPull > 6*3600e3){ lastPull = Date.now(); pull(false); } }, 6e5);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && Date.now()-lastPull > 6*3600e3){ lastPull = Date.now(); pull(false); }
});

/* ---------- utils ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function debounce(f,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>f(...a),ms); }; }

/* ================= access gate =================================
   Only a salted SHA-256 digest of the code lives in this file. Note this
   is an access gate, not encryption: it keeps casual viewers out of the
   dashboard, but the data itself is still inside the file for anyone who
   opens it in a text editor. See the handover notes.
   ============================================================== */
const GATE_SALT = 'ice-tb-linelist:';
const GATE_HASH = '00be8a1a34a980c113f7b69a7d87814a8c7b210b3a645766effddc4b24fa294d';

/* compact SHA-256 — self-contained so it also works from file:// where
   crypto.subtle is not guaranteed to be available */
function sha256(msg){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes=[...new TextEncoder().encode(msg)];
  const bitLen=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push((bitLen/Math.pow(2,i*8))&0xff);
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let b=0;b<bytes.length;b+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++) w[i]=(bytes[b+i*4]<<24)|(bytes[b+i*4+1]<<16)|(bytes[b+i*4+2]<<8)|bytes[b+i*4+3];
    for(let i=16;i<64;i++){
      const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3);
      const s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    let [a,c,d,e,f,g,h,i2]=H;
    for(let j=0;j<64;j++){
      const S1=rr(f,6)^rr(f,11)^rr(f,25), ch=(f&g)^(~f&h);
      const t1=(i2+S1+ch+K[j]+w[j])|0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&c)^(a&d)^(c&d);
      const t2=(S0+mj)|0;
      i2=h; h=g; g=f; f=(e+t1)|0; e=d; d=c; c=a; a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+c)|0,(H[2]+d)|0,(H[3]+e)|0,(H[4]+f)|0,(H[5]+g)|0,(H[6]+h)|0,(H[7]+i2)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

const gate = document.getElementById('gate'),
      card = document.getElementById('gateCard'),
      pw   = document.getElementById('gatePw'),
      gerr = document.getElementById('gateErr');

function unlock(){
  gate.classList.add('hidden');
  document.body.classList.remove('locked');
  header(); run();
  pull(false);   // snapshot is on screen already; now try to go live
}

// When the page is hosted behind real sign-in (Entra ID), the build sets
// gate:false and this local code gate is skipped entirely.
if(DATA.gate === false){
  gate.remove();
  unlock();
} else {
  pw.focus();
}

card.addEventListener('submit', e =>{
  e.preventDefault();
  if(sha256(GATE_SALT + pw.value) === GATE_HASH){ unlock(); return; }
  gerr.hidden = false;
  card.classList.remove('shake');
  void card.offsetWidth;              // restart the animation
  card.classList.add('shake');
  pw.value = ''; pw.focus();
});
pw.addEventListener('input', ()=>{ gerr.hidden = true; });
</script>
